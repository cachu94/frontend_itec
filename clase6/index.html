<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discogs Album Rater</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center pb-10 pt-5">

    <div class="flex w-full justify-around items-center gap-4 mb-6">
    
        <button id="homeBtn" class="bg-gray-300 text-gray-800 px-4 py-2 rounded-md hover:bg-gray-400">
            🏠 Home
        </button>

        <h1 class="text-3xl font-bold text-gray-800">🎶 Calificador de Álbumes</h1>

        <button id="profileBtn" class="bg-gray-300 text-gray-800 px-4 py-2 rounded-md hover:bg-gray-400">
            👤 Mi Perfil
        </button>

    </div>

    <div class="flex flex-col sm:flex-row gap-4 items-center mb-6">
        <input id="busquedaInput" type="text" placeholder="Buscar artista o álbum ..." 
            class="border border-gray-300 rounded-md px-4 py-2 bg-white shadow-sm w-72">
        <button id="buscarBtn" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Buscar</button>
    </div>

    <div id="albumsContainer"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 px-4 w-full max-w-6xl">
    
    </div>


    <script src="app.js"></script>
</body>
</html>
