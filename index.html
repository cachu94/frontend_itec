<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giacri - TP01</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-family-sans bg-slate-100 text-slate-800">
    <header class="flex items-center justify-between p-4 bg-slate-800 text-white text-2xl">
        <button id="homeBtn" class="bg-blue-600 hover:bg-blue-700">Inicio</button>
        <h1>Discografía</h1>
        <button id="perfilBtn" class="border border-red-950 p-2 rounded">Mi Perfil</button>
    </header>

    <section class="flex items-center justify-center p-4 gap-4">
        <input class="text-slate-800" id="buscadorInput" type="text" placeholder="Buscar artista o álbum..."">
        <button id="buscadorBtn" class="bg-blue-600 hover:bg-blue-700">Buscar</button>
    </section>
    
    <section id="contenedoralbums" class="p-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></section>

    <script src="app.js"></script>
</body>
</html>
