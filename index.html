<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giacri - TP01</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = {theme: {extend: {fontFamily: {'alkatra': ['Alkatra', 'cursive']}}}}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alkatra:wght@400..700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen font-alkatra bg-gradient-to-b from-slate-100 to-slate-200 text-slate-800">
    <header class="sticky top z-10 flex items-center justify-between p-4 bg-slate-800/95 backdrop-blur text-white text-2xl shadow-md">
        <button id="homeBtn" class="bg-blue-600 hover:bg-blue-700 p-2 rounded font-alkatra">Inicio</button>
        <h1 class="font-alkatra">DISCOGRAFÍA</h1>
        <button id="perfilBtn" class="bg-blue-600 hover:bg-blue-700 p-2 rounded font-alkatra">Mi Perfil</button>
    </header>

    <section class="flex font-alkatra items-center justify-center p-4 gap-3 max-w-xl mx-auto">
        <input class="flex-1 font-alkatra text-slate-800 p-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500" id="buscadorInput" type="text" placeholder="Buscar artista o álbum...">
        <button id="buscadorBtn" class="bg-blue-600 hover:bg-blue-700 p-2 rounded text-white font-alkatra text-lg">Buscar</button>
    </section>
    
    <section id="contenedoralbums" class="p-4 max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></section>

    <script src="app.js"></script>
</body>
</html>
